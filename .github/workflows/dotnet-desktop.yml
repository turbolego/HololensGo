name: UWP Package

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: NuGet restore
      run: nuget restore HololensGo.sln

    - name: Install Windows 10 SDK + UWP MSBuild
      shell: powershell
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -property installationPath
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        & $installer modify `
          --installPath "$vsPath" `
          --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
          --add Microsoft.VisualStudio.ComponentGroup.UWP.MSBuild `
          --quiet --norestart --force

    - name: Generate self-signed certificate
      shell: powershell
      run: |
        $cert = New-SelfSignedCertificate -Type Custom `
          -Subject "CN=BB1A7F2A-A87C-44C8-8C14-84C6486E7E75" `
          -KeyUsage DigitalSignature `
          -FriendlyName "HololensGo" -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
        Export-PfxCertificate -Cert $cert -FilePath "${{ github.workspace }}\cert.pfx" `
          -Password (ConvertTo-SecureString "ci" -Force -AsPlainText)

    - name: Build .appxupload
      shell: powershell
      run: >
        msbuild HololensGo.csproj
        /t:Publish
        /p:Configuration=Release
        /p:Platform=x86
        /p:AppxBundle=Never
        /p:UapAppxPackageBuildMode=StoreUpload
        /p:AppxPackageDir=AppPackages\
        /p:AppxPackageSigningEnabled=true
        /p:PackageCertificateKeyFile=${{ github.workspace }}\cert.pfx
        /p:PackageCertificatePassword=ci
        /p:PackageCertificateThumbprint=""
        /v:minimal

    - name: Remove signing certificate
      if: always()
      run: Remove-Item -Path "${{ github.workspace }}\cert.pfx" -ErrorAction SilentlyContinue
      shell: powershell

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: HololensGo-${{ github.sha }}
        path: AppPackages/**/*